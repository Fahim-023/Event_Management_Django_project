{% extends 'events/base.html' %}
{% block title %}Groups{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">All Groups</h1>

<ul class="list-disc ml-6">
    {% for group in groups %}
        <li>{{ group.name }}</li>
    {% empty %}
        <li>No groups found.</li>
    {% endfor %}
</ul>
{% endblock %}

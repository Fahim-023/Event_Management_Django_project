{% extends 'events/base.html' %}
{% block title %}Assign Role{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">Assign Role to {{ user.username }}</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded">Assign</button>
</form>
{% endblock %}

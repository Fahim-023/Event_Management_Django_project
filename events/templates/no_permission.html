{% extends "base.html" %}

{% block title %}No Permission{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto mt-12 bg-red-50 border border-red-300 rounded-lg p-6 shadow">
    <h1 class="text-2xl font-bold text-red-700 mb-4">Access Denied</h1>
    <p class="text-gray-700">
        You do not have permission to view this page.
    </p>
    <p class="text-gray-700 mt-2">
        If you believe this is a mistake, please contact the site administrator.
    </p>
    <div class="mt-4">
        <a href="{% url 'home' %}" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
            Go Back to Home
        </a>
    </div>
</div>
{% endblock %}

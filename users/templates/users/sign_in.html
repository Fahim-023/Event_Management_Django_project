<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Event Management</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800">
    <nav class="bg-blue-600 text-white p-4 flex justify-between">
        <div class="font-bold text-xl">Event Management</div>
        <div class="space-x-4">
            <a href="{% url 'home' %}" class="hover:underline">Home</a>
            <a href="{% url 'dashboard' %}" class="hover:underline">Dashboard</a>
        </div>
    </nav>

    <div class="p-6">
        <div class='w-1/2 mx-auto my-auto mb-20'>
            <form action="" method="POST">
                {% csrf_token %}
                {{form.as_p}}
                <button type="submit" class='bg-green-400 px-2 py-1 rounded mt-3 text-white'>Sign Up</button>
            </form>
        </div>
    </div>
    <footer class="bg-gray-800 text-white py-12 mt-20">
      <div class="container mx-auto px-6">
        <div class="flex flex-wrap justify-between">
          <div class="w-full md:w-1/4 mb-8 md:mb-0">
            <h3 class="text-lg font-semibold mb-4">Event Management</h3>
            <p class="text-gray-400">
              Empowering teams with efficient Event management solutions.
            </p>
          </div>
          <div class="w-full md:w-1/4 mb-8 md:mb-0">
            <h4 class="text-lg font-semibold mb-4">Quick Links</h4>
            <ul class="text-gray-400 space-y-2">
              <li><a href="#" class="hover:text-white">Home</a></li>
              <li><a href="#" class="hover:text-white">Features</a></li>
              <li><a href="#" class="hover:text-white">Pricing</a></li>
              <li><a href="#" class="hover:text-white">Contact</a></li>
            </ul>
          </div>
          <div class="w-full md:w-1/4 mb-8 md:mb-0">
            <h4 class="text-lg font-semibold mb-4">Connect</h4>
            <ul class="text-gray-400 space-y-2">
              <li><a href="#" class="hover:text-white">Twitter</a></li>
              <li><a href="#" class="hover:text-white">LinkedIn</a></li>
              <li><a href="#" class="hover:text-white">Facebook</a></li>
            </ul>
          </div>
          <div class="w-full md:w-1/4">
            <h4 class="text-lg font-semibold mb-4">Newsletter</h4>
            <form class="flex">
              <input
                type="email"
                placeholder="Your email"
                class="w-full px-3 py-2 text-gray-700 bg-gray-200 rounded-l-md focus:outline-none"
                required
              />
              <button
                type="submit"
                class="bg-blue-500 text-white px-4 py-2 rounded-r-md hover:bg-blue-600 transition duration-300"
              >
                Subscribe
              </button>
            </form>
          </div>
        </div>
        <div
          class="border-t border-gray-700 mt-12 pt-8 text-sm text-center text-gray-400"
        >
          &copy; 2025 Event. All rights reserved.
        </div>
      </div>
    </footer>
</body>
</html>
